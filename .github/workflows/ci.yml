name: Checks and release package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate package and documentation
        run: python scripts/validate_package.py

  package:
    if: github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Check tag and build marketplace archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys

          version = json.loads(Path('plugins/codeflow/.codex-plugin/plugin.json').read_text())['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              sys.exit('Release tag must match the plugin manifest version')
          package = Path('dist') / f'codeflow-v{version}'
          subprocess.run([sys.executable, 'scripts/prepare_marketplace.py', str(package)], check=True)
          shutil.make_archive(str(package), 'zip', root_dir=package.parent, base_dir=package.name)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeflow-${{ github.ref_name }}
          path: dist/codeflow-*.zip
          if-no-files-found: error
